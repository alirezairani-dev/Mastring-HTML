<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Block and Inline Elements</title>
</head>
<body>
   <!-- Block-level Element  -->
  <div>Block-level item 1</div>
  <p>Block-level item 2</p>

  <hr>

  <!-- Inline-level Element -->
  <span>Inline item 1</span>
  <span>Inline item 2</span>

  <hr>

  <div>Block-level item</div>
  <span>Inline item</span>
</body>
</html>
