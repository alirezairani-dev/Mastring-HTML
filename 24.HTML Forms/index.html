<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Forms</title>
</head>
<body>
    <!-- The HTML <form> element is used to create an HTML form for user input -->
    <!-- Text field -->
    <form>
       <label for="fname">First name: </label>
       <input type="text" id="fname" name="fname"><br>
       <label for="lname">Last name: </label>
       <input type="text" id="lname" name="lname">
    </form>
    <!-- Radio button -->
    <p>Choose your favorite Web language: </p>
    <form>
      <input type="radio" id="html" name="fav_language">
      <label for="html">HTML</label>
      <input type="radio" id="css" name="fav_language">
      <label for="css">CSS</label>
      <input type="radio" id="js" name="fav_language">
      <label for="js">JavaScript</label>
    </form>
    <!-- Checkbox button -->
    <form>
      <input type="checkbox" name="vehicle1" id="vehicle1" value="Bike">
      <label for="vehicle1">I have a Bike</label>
      <input type="checkbox" name="vehicle2" id="vehicle2" value="Car">
      <label for="vehicle2">I have a Car</label>
      <input type="checkbox" name="vehicle3" id="vehicle3" value="Boat">
      <label for="vehicle3">I have a Boat</label>
    </form>

    <!-- Submit button -->
    <form action="/action_page.php">
      <label for="fname">First name:</label><br>
      <input type="text" id="fname" name="fname" value="John"><br>
      <label for="lname">Last name:</label><br>
      <input type="text" id="lname" name="lname" value="Doe"><br><br>
      <input type="submit" value="Submit">
    </form>
</body>
</html>
