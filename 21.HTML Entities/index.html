<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Entities</title>
</head>
<body>
   <!-- &nbsp; (it should have a semi-colon on the end) is an entity for a non-breaking space.
    Use it between two words that should not have a line break inserted between them by word wrapping. -->
  <p>Hello &nbsp;<span>world</span></p>
</body>
</html>
