<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>
<body>
    <!-- A simple HTML table:  -->
    <table>
        <!-- tr : Table row -->
        <tr>
            <!-- th : Table heading -->
            <th>Company</th>
            <th>Contact</th>
            <th>Country</th>
        </tr>
        <tr>
            <!-- td : Table data -->
            <td>Alexia</td>
            <td>James</td>
            <td>Germany</td>
        </tr>
    </table>

    <!-- Another Example -->
     <table>
        <tr>
            <th>Courses</th>
            <th>Time</th>
        </tr>
        <tr>
            <td>HTML</td>
            <td>5h</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>11h</td>
        </tr>
     </table>
</body>
</html>
