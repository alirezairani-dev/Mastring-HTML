<!DOCTYPE html>
<html>
    <head>
        <title>HTML Links</title>
    </head>
    <body>
        <!-- HTML Links - Syntax -->
        <!-- The HTML <a> tag defines a hyperlink. It has the following syntax: -->
        <a href="url">Link text</a>

        <!-- This link will move you to Google.com page -->
        <a href="https://google.com">Google.com</a>

        <!-- This link will open a new tab and open Google.com page -->
        <a href="https://google.com" target="_blank">Google.com</a>

        <!-- The above links are absolute -->
        <!-- Relative links -->
        <a href="html_image.png">HTML Image</a>
        <a href="html_tutorial_image.jpg">HTML Tutorial</a>

        <!-- HTML Links - Use an Image as a Link -->
        <!-- To use an image as a link, just put the <img> tag inside the <a> tag: -->
        <a href="url">
            <img src="HTML.png" alt="HTML Tutorial">
        </a>
        <!-- Link to an Email Address -->
        <!-- Use mailto: inside the href attribute to create a link that opens the user's email program (to let them send a new email): -->
        <a href="mailto:someone@example.com">Send email</a>

        <!-- Link Titles -->
        <!-- The title attribute specifies extra information about an element. The information is most often shown as a tooltip text when the mouse moves over the element. -->
        <a href="https://google.com" title="Go to Google page">Google.com</a>
    </body>
</html>
